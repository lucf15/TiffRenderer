name: Set up Android build toolchain
description: JDK + Android SDK + pinned NDK/CMake + Gradle, shared by every workflow that builds the native library.

inputs:
  java-version:
    description: Temurin JDK version
    default: "17"
  ndk-version:
    description: Pinned NDK version (must match lib/native/build.gradle.kts's ndkVersion)
    default: "29.0.14206865"
  cmake-version:
    description: Pinned CMake version (must match gradle/libs.versions.toml's cmake entry)
    default: "4.1.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

    - name: Install pinned NDK + CMake
      shell: bash
      run: |
        sdkmanager --install "ndk;${{ inputs.ndk-version }}" "cmake;${{ inputs.cmake-version }}"
        echo "TIFFRENDERER_SDK_CMAKE=${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmake/${{ inputs.cmake-version }}/bin/cmake" >> "$GITHUB_ENV"

    - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
