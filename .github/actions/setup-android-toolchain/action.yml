name: Set up Android build toolchain
description: JDK + Android SDK + pinned NDK/CMake + Gradle, shared by every workflow that builds the native library.

inputs:
  java-version:
    description: Temurin JDK version
    default: "17"
  ndk-version:
    description: Pinned NDK version (must match lib/native/build.gradle.kts's ndkVersion)
    default: "28.2.13676358"
  cmake-version:
    description: Pinned CMake version (must match lib/native/build.gradle.kts's externalNativeBuild.cmake.version)
    default: "3.22.1"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

    - name: Install pinned NDK + CMake
      shell: bash
      run: sdkmanager --install "ndk;${{ inputs.ndk-version }}" "cmake;${{ inputs.cmake-version }}"

    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
