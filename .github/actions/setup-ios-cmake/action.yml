name: Set up a pinned iOS-capable CMake
description: >
  Downloads a checksummed CMake newer than the NDK-pinned 3.22.1 (needed for the iOS
  Xcode-generator build) and sets TIFFRENDERER_IOS_CMAKE to it.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        cd /tmp
        curl -fsSLO https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz
        echo "330b9514f5112e5ed4fb08b8b05803b776fd9b539a6ae12927d14dcc0ee2ba8d  cmake-3.31.6-macos-universal.tar.gz" | shasum -a 256 -c -
        tar xzf cmake-3.31.6-macos-universal.tar.gz
        echo "TIFFRENDERER_IOS_CMAKE=/tmp/cmake-3.31.6-macos-universal/CMake.app/Contents/bin/cmake" >> "$GITHUB_ENV"
