name: Set up JVM toolchain and test
description: >
  Installs JDK/Gradle for the given OS/arch (plus the Android SDK on hosted-ARM runners, needed
  for their cmake), then runs the given Gradle tasks.

inputs:
  os:
    description: The runner OS (matrix.os), used to decide whether the Android SDK/cmake is needed
    required: true
  java-distribution:
    required: true
  java-arch:
    required: true
  gradle-tasks:
    default: ":lib:core:jvmTest :sample:shared:jvmTest :sample:desktopApp:jar"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: "17"
        architecture: ${{ inputs.java-arch }}

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      if: contains(fromJSON('["ubuntu-24.04-arm", "windows-11-arm"]'), inputs.os)
      with:
        packages: ""

    - name: Install Linux graphics libraries
      if: startsWith(inputs.os, 'ubuntu')
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libgl1 libegl1

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - shell: bash
      run: ./gradlew ${{ inputs.gradle-tasks }}
