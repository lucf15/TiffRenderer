name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

  build-android:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TIFFRENDERER_WERROR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - name: Build library (all ABIs)
        run: ./gradlew :lib:core:bundleAndroidMainAar :lib:native:bundleReleaseAar

      - name: Build sample app
        run: ./gradlew :sample:androidApp:assembleDebug

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sample-debug-apk
          path: sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lib-debug-aar
          path: lib/core/build/outputs/aar/core.aar
          if-no-files-found: error

      - name: Extract this job's own compiled .so files for reuse in publish-central
        run: |
          mkdir -p /tmp/android-native-libs
          cd /tmp/android-native-libs
          unzip -q "${{ github.workspace }}/lib/native/build/outputs/aar/native-release.aar" 'jni/*'
          mv jni/* .
          rmdir jni
          find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + > SHA256SUMS

      - name: Attest build provenance for the Android native libs this job built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: /tmp/android-native-libs/*/*.so

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-native-libs
          path: /tmp/android-native-libs
          if-no-files-found: error
          retention-days: 1

      - uses: ./.github/actions/run-android-instrumented-tests

  build-jvm:
    needs: validate-wrapper
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            java-arch: arm64
            java-distribution: temurin
          - os: macos-latest
            java-arch: x64
            java-distribution: temurin
          - os: ubuntu-latest
            java-arch: x64
            java-distribution: temurin
          - os: ubuntu-24.04-arm
            java-arch: arm64
            java-distribution: temurin
          - os: windows-latest
            java-arch: x64
            java-distribution: temurin
          - os: windows-11-arm
            java-arch: arm64
            java-distribution: zulu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TIFFRENDERER_WERROR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-jvm-and-test
        with:
          os: ${{ matrix.os }}
          java-distribution: ${{ matrix.java-distribution }}
          java-arch: ${{ matrix.java-arch }}

      - name: Check JVM API surface (host-independent, pinned to one leg)
        if: matrix.os == 'ubuntu-latest' && matrix.java-arch == 'x64'
        run: ./gradlew :lib:core:jvmApiCheck

      - name: Checksum the natives this job just built and tested
        shell: bash
        run: |
          cd lib/native/build/jvm/natives
          subdirs=()
          while IFS= read -r dir; do
            subdirs+=("$dir")
          done < <(find . -mindepth 1 -maxdepth 1 -type d | sort)
          if [ "${#subdirs[@]}" -ne 1 ]; then
            echo "expected exactly one native subdir, found ${#subdirs[@]}: ${subdirs[*]}" >&2
            exit 1
          fi
          cd "${subdirs[0]}"
          if command -v sha256sum >/dev/null 2>&1; then
            find . -type f ! -name SHA256SUMS -exec sha256sum {} + > SHA256SUMS
          else
            find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + > SHA256SUMS
          fi

      - name: Attest build provenance for the native library this job built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            lib/native/build/jvm/natives/*/*.dylib
            lib/native/build/jvm/natives/*/*.so
            lib/native/build/jvm/natives/*/*.dll

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jvm-natives-${{ matrix.os }}-${{ matrix.java-arch }}
          path: lib/native/build/jvm/natives/
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: validate-wrapper
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TIFFRENDERER_WERROR: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - run: ./gradlew :lib:core:compileKotlinIosArm64 :lib:core:iosSimulatorArm64Test :lib:core:klibApiCheck

      - name: Checksum the iOS native libs this job just built and tested
        shell: bash
        run: |
          cd lib/native/build/ios
          for dir in */; do
            (cd "$dir" && find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + > SHA256SUMS)
          done

      - name: Attest build provenance for the iOS native libs this job built
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: lib/native/build/ios/*/*.a

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-native-libs
          path: lib/native/build/ios/
          if-no-files-found: error
          retention-days: 1

  semantic-release:
    needs: [build-android, build-jvm, build-ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - id: release
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download sample APK
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sample-debug-apk
          path: release-assets

      - name: Attach sample APK to the new release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv release-assets/androidApp-debug.apk "release-assets/tiffrenderer-sample-v${{ steps.release.outputs.new_release_version }}.apk"
          gh release upload "v${{ steps.release.outputs.new_release_version }}" release-assets/*.apk --repo ${{ github.repository }}

  publish-central:
    needs: [semantic-release, build-android, build-jvm, build-ios]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    outputs:
      publish_attempted: ${{ steps.publish.outputs.attempted == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - name: Download Linux/Windows JVM natives built by the build-jvm matrix
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: jvm-natives-*
          path: lib/native/build/jvm/natives
          merge-multiple: true

      - name: Verify downloaded JVM natives are internally consistent (not corrupted in transit)
        run: |
          cd lib/native/build/jvm/natives
          for name in linux-x86_64 linux-aarch64 windows-x86_64 windows-aarch64 macos-x86_64 macos-aarch64; do
            [ -d "$name" ] || { echo "missing natives for $name" >&2; exit 1; }
          done
          for dir in */; do
            (cd "$dir" && shasum -a 256 -c SHA256SUMS --strict)
          done

      - name: Verify downloaded JVM natives match build-jvm's attested provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lib/native/build/jvm/natives
          verified=0
          for f in */*.dylib */*.so */*.dll; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}" \
                --signer-workflow "${{ github.repository }}/.github/workflows/ci.yml"
            verified=$((verified + 1))
          done
          if [ "$verified" -ne 6 ]; then
            echo "expected to verify 6 native libraries, verified $verified" >&2
            exit 1
          fi

      - name: Download iOS native libs built by build-ios
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-native-libs
          path: lib/native/build/ios

      - name: Verify downloaded iOS native libs are internally consistent (not corrupted in transit)
        run: |
          cd lib/native/build/ios
          for name in iosArm64 iosSimulatorArm64; do
            [ -d "$name" ] || { echo "missing natives for $name" >&2; exit 1; }
          done
          for dir in */; do
            (cd "$dir" && shasum -a 256 -c SHA256SUMS --strict)
          done

      - name: Verify downloaded iOS native libs match build-ios's attested provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd lib/native/build/ios
          verified=0
          for f in */*.a; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}" \
                --signer-workflow "${{ github.repository }}/.github/workflows/ci.yml"
            verified=$((verified + 1))
          done
          # libtiffrenderer_core.a + libtiff.a + libijg_jpeg.a + libwebp.a + libsharpyuv.a, per target
          if [ "$verified" -ne 10 ]; then
            echo "expected to verify 10 iOS native libs (5 per target x 2 targets), verified $verified" >&2
            exit 1
          fi

      - name: Download Android native libs built by build-android
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-native-libs
          path: /tmp/android-native-libs

      - name: Verify downloaded Android native libs are internally consistent (not corrupted in transit)
        run: |
          cd /tmp/android-native-libs
          for name in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d "$name" ] || { echo "missing natives for $name" >&2; exit 1; }
          done
          shasum -a 256 -c SHA256SUMS --strict

      - name: Verify downloaded Android native libs match build-android's attested provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/android-native-libs
          verified=0
          for f in */*.so; do
            [ -f "$f" ] || continue
            gh attestation verify "$f" --repo "${{ github.repository }}" \
                --signer-workflow "${{ github.repository }}/.github/workflows/ci.yml"
            verified=$((verified + 1))
          done
          if [ "$verified" -ne 4 ]; then
            echo "expected to verify 4 Android native libs (one per ABI), verified $verified" >&2
            exit 1
          fi

      - name: Publish to Maven Central
        id: publish
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
          TIFFRENDERER_SKIP_JVM_NATIVE_BUILD: "true"
          TIFFRENDERER_SKIP_IOS_NATIVE_BUILD: "true"
          TIFFRENDERER_SKIP_ANDROID_NATIVE_BUILD: "true"
          TIFFRENDERER_PREBUILT_JNI_LIBS_DIR: /tmp/android-native-libs
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          ./gradlew publishToMavenCentral

  rollback-release:
    needs: [semantic-release, publish-central]
    if: >-
      always() && needs.semantic-release.outputs.new_release_published == 'true'
      && contains(fromJSON('["failure", "cancelled"]'), needs.publish-central.result)
      && needs.publish-central.outputs.publish_attempted != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the release and tag semantic-release just created, since nothing was actually published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ needs.semantic-release.outputs.new_release_version }}" --repo ${{ github.repository }} --yes --cleanup-tag

  alert-publish-failure-after-upload-attempt:
    needs: [semantic-release, publish-central]
    if: >-
      always() && needs.semantic-release.outputs.new_release_published == 'true'
      && contains(fromJSON('["failure", "cancelled"]'), needs.publish-central.result)
      && needs.publish-central.outputs.publish_attempted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail loudly without touching the tag or release
        run: |
          echo "publish-central ${{ needs.publish-central.result }} after the Maven Central upload step started. Central versions are immutable, so the tag/release are left in place: check the Central Portal deployment for v${{ needs.semantic-release.outputs.new_release_version }} by hand before deciding what to do." >&2
          exit 1
