name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - name: Build library (all ABIs)
        run: ./gradlew :lib:core:bundleAndroidMainAar

      - name: Build sample app
        run: ./gradlew :sample:androidApp:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sample-debug-apk
          path: sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: lib-debug-aar
          path: lib/core/build/outputs/aar/core.aar
          if-no-files-found: error

  build-jvm:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew :lib:core:jvmTest :sample:desktopApp:jar

      - uses: actions/upload-artifact@v4
        with:
          name: jvm-natives-${{ matrix.os }}
          path: lib/native/build/jvm/natives/
          if-no-files-found: error
          retention-days: 1

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - name: Install a CMake newer than the NDK-pinned 3.22.1 for the iOS Xcode-generator build
        run: |
          brew install cmake
          echo "TIFFRENDERER_IOS_CMAKE=$(brew --prefix cmake)/bin/cmake" >> "$GITHUB_ENV"

      - run: ./gradlew :lib:core:compileKotlinIosArm64 :lib:core:compileKotlinIosSimulatorArm64

  release:
    needs: [build-android, build-jvm, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sample-debug-apk
          path: release-assets

      - name: Rename artifact to include the tag
        run: mv release-assets/androidApp-debug.apk "release-assets/tiffrenderer-sample-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true

  semantic-release:
    needs: [build-android, build-jvm, build-ios]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - id: release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download sample APK
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/download-artifact@v4
        with:
          name: sample-debug-apk
          path: release-assets

      - name: Attach sample APK to the new release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv release-assets/androidApp-debug.apk "release-assets/tiffrenderer-sample-v${{ steps.release.outputs.new_release_version }}.apk"
          gh release upload "v${{ steps.release.outputs.new_release_version }}" release-assets/*.apk --repo ${{ github.repository }}

  publish-central:
    needs: [semantic-release, build-jvm]
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.semantic-release.outputs.new_release_version }}
          submodules: recursive

      - uses: ./.github/actions/setup-android-toolchain

      - name: Install a CMake newer than the NDK-pinned 3.22.1 for the iOS Xcode-generator build
        run: |
          brew install cmake
          echo "TIFFRENDERER_IOS_CMAKE=$(brew --prefix cmake)/bin/cmake" >> "$GITHUB_ENV"

      - name: Download Linux/Windows JVM natives built by the build-jvm matrix
        uses: actions/download-artifact@v4
        with:
          pattern: jvm-natives-*
          path: lib/native/build/jvm/natives
          merge-multiple: true

      - name: Publish to Maven Central
        env:
          VERSION: ${{ needs.semantic-release.outputs.new_release_version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishToMavenCentral
