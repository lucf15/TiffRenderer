name: Check for libtiff updates

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: libtiff-update-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-check:
    uses: ./.github/workflows/native-lib-update-check.yml
    with:
      library_name: libtiff
      repo_url: https://gitlab.com/libtiff/libtiff
      tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      version_prefix: v
      readme_link_text: libtiff
    secrets: inherit
