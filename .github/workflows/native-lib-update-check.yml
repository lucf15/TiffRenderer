name: Native library update check

on:
  workflow_call:
    inputs:
      library_name:
        description: 'Submodule directory name under lib/native/src/main/cpp/third_party/, e.g. "libtiff"'
        required: true
        type: string
      repo_url:
        description: "Upstream repo URL, for the PR body text"
        required: true
        type: string
      tag_pattern:
        description: 'grep -E pattern matching this library''s real release tags, e.g. "^v[0-9]+\.[0-9]+\.[0-9]+$" or "^jpeg-[0-9]+[a-z]?$"'
        required: true
        type: string
      version_prefix:
        description: 'Literal prefix stripped from a tag to get the version README.md displays, e.g. "v" (tag v4.7.2 -> 4.7.2) or "jpeg-" (tag jpeg-10 -> 10)'
        required: true
        type: string
      readme_link_text:
        description: 'Exact markdown link text README.md uses for this library in its version table, e.g. "libtiff" or "IJG libjpeg"'
        required: true
        type: string
    secrets:
      token:
        description: "GITHUB_TOKEN to open/merge the bump PR. Pass only this, never secrets: inherit."
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.check.outputs.bump }}
      new_tag: ${{ steps.check.outputs.new_tag }}
      new_sha: ${{ steps.check.outputs.new_sha }}
      current_tag: ${{ steps.check.outputs.current_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Check for a newer stable tag
        id: check
        env:
          TAG_PATTERN: ${{ inputs.tag_pattern }}
        run: |
          cd "lib/native/src/main/cpp/third_party/${{ inputs.library_name }}"
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --unshallow --tags --quiet
          else
            git fetch --tags --quiet
          fi
          current_tag=$(git describe --tags --exact-match 2>/dev/null || git rev-parse --short HEAD)
          latest_tag=$(git tag -l | grep -E "$TAG_PATTERN" | sort -V | tail -1)
          latest_sha=$(git rev-parse "$latest_tag^{commit}")
          echo "current: $current_tag, latest: $latest_tag"
          if ! git merge-base --is-ancestor "$latest_sha" HEAD; then
            {
              echo "bump=true"
              echo "new_tag=$latest_tag"
              echo "new_sha=$latest_sha"
              echo "current_tag=$current_tag"
            } >> "$GITHUB_OUTPUT"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi

  pr:
    needs: check
    if: needs.check.outputs.bump == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      pull-request-number: ${{ steps.pr.outputs.pull-request-number }}
      branch: bump-${{ inputs.library_name }}-${{ needs.check.outputs.new_tag }}
      head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          token: ${{ secrets.token }}

      - uses: ./.github/actions/checkout-candidate-submodule
        with:
          library_name: ${{ inputs.library_name }}
          new_sha: ${{ needs.check.outputs.new_sha }}

      - name: Update README version reference
        env:
          VERSION_PREFIX: ${{ inputs.version_prefix }}
          README_LINK_TEXT: ${{ inputs.readme_link_text }}
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          path = Path("README.md")
          rows = path.read_text().splitlines(keepends=True)
          label = f"[{os.environ['README_LINK_TEXT']}]("
          matches = [i for i, row in enumerate(rows) if row.startswith("|") and label in row.split("|")[1]]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one native library version row")
          cells = rows[matches[0]].split("|")
          cells[2] = " " + os.environ["NEW_TAG"].removeprefix(os.environ["VERSION_PREFIX"]) + " "
          rows[matches[0]] = "|".join(cells)
          path.write_text("".join(rows))
          PYTHON

      - name: Open PR
        id: pr
        env:
          NEW_TAG: ${{ needs.check.outputs.new_tag }}
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          commit-message: "chore(${{ inputs.library_name }}): bump submodule to ${{ needs.check.outputs.new_tag }}"
          title: "chore(${{ inputs.library_name }}): bump submodule to ${{ needs.check.outputs.new_tag }}"
          body: |
            Update the pinned ${{ inputs.library_name }} source to `${{ needs.check.outputs.new_tag }}`
            from ${{ inputs.repo_url }} and update its README version.

            The full CI is dispatched for this commit. The PR merges only after it passes.
          branch: bump-${{ inputs.library_name }}-${{ needs.check.outputs.new_tag }}
          base: main
          labels: dependencies

      - name: Dispatch a real ci.yml run against the bump branch
        env:
          GH_TOKEN: ${{ secrets.token }}
        run: |
          gh workflow run ci.yml --repo ${{ github.repository }} \
              --ref bump-${{ inputs.library_name }}-${{ needs.check.outputs.new_tag }}

  wait-for-required-checks:
    needs: [check, pr]
    if: needs.pr.outputs.pull-request-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Find and wait for the dispatched ci.yml run
        env:
          GH_TOKEN: ${{ secrets.token }}
          BRANCH: ${{ needs.pr.outputs.branch }}
          HEAD_SHA: ${{ needs.pr.outputs.head-sha }}
        run: |
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
                --branch "$BRANCH" --event workflow_dispatch --limit 1 \
                --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId" 2>/dev/null || echo "")
            [ -n "$run_id" ] && break
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "dispatched ci.yml run never appeared for branch $BRANCH" >&2
            exit 1
          fi
          echo "watching ci.yml run $run_id on branch $BRANCH"
          gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status

  merge:
    needs: [pr, wait-for-required-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.token }}
          REPO: ${{ github.repository }}
        run: |
          gh pr merge "${{ needs.pr.outputs.pull-request-number }}" --repo "$REPO" --squash --delete-branch
          gh workflow run ci.yml --repo "$REPO" --ref main -F publish=true
